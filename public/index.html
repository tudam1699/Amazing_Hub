<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazing Hub - Car AC Compressor Repair Services</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f4f7f6; color: #333; }
    header { background-color: #0d3b66; color: white; padding: 25px; text-align: center; }
    header h1 { font-size: 28px; margin-bottom: 8px; }
    header p { font-size: 15px; opacity: 0.9; }
    .nav-bar { background: #082d50; text-align: right; padding: 10px 20px; }
    .admin-btn { background: #00b4d8; color: white; text-decoration: none; padding: 8px 16px; border-radius: 5px; font-weight: bold; font-size: 14px; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .section-title { font-size: 22px; color: #0d3b66; margin-bottom: 20px; border-bottom: 3px solid #00b4d8; display: inline-block; padding-bottom: 5px; }
    .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 10px; }
    .service-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid #0d3b66; transition: transform 0.2s; }
    .service-card:hover { transform: translateY(-3px); }
    .service-card h3 { color: #0d3b66; margin-bottom: 10px; font-size: 18px; }
    .service-card p { font-size: 14px; color: #666; line-height: 1.5; margin-bottom: 15px; }
    .service-price { font-size: 18px; font-weight: bold; color: #2a9d8f; }
    .no-services { background: white; padding: 30px; text-align: center; border-radius: 8px; color: #777; width: 100%; grid-column: 1/-1; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a href="/admin" class="admin-btn">Admin Panel</a>
  </div>

  <header>
    <h1>Amazing Hub</h1>
    <p>Car AC Compressor Repairing & Overhauling Services</p>
  </header>

  <div class="container">
    <h2 class="section-title">Our Services</h2>
    <div id="servicesList" class="services-grid">
      <div class="no-services">Loading services...</div>
    </div>
  </div>

  <script>
    async function fetchServices() {
      const container = document.getElementById('servicesList');
      try {
        const res = await fetch('/api/services');
        const services = await res.json();

        if (!Array.isArray(services) || services.length === 0) {
          container.innerHTML = '<div class="no-services">Abhi koi service add nahi hui. Admin panel se add karein.</div>';
          return;
        }

        container.innerHTML = services.map(s => `
          <div class="service-card">
            <h3>${s.title}</h3>
            <p>${s.description}</p>
            <div class="service-price">Rs. ${s.price}</div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<div class="no-services">Services load karne mein masla aaya.</div>';
      }
    }

    fetchServices();
  </script>
</body>
</html>
