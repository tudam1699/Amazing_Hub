
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazing Hub - Car AC Specialist</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; color: #333; }
    header { background: #003366; color: #fff; padding: 20px; text-align: center; }
    .container { max-width: 1000px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; }
    h1 { margin: 0; }
    .service-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
    .btn { display: inline-block; background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Amazing Hub</h1>
    <p>Car AC Compressor Repairing & Overhauling Specialist</p>
  </header>
  <div class="container">
    <h2>Our Services</h2>
    <div id="services-list">Loading services...</div>
    <br>
    <a href="/admin.html" class="btn">Admin Panel Login</a>
  </div>

  <script>
    async function loadServices() {
      try {
        const res = await fetch('/api/services');
        const services = await res.json();
        const container = document.getElementById('services-list');
        if (services.length === 0) {
          container.innerHTML = '<p>Car AC Compressor Overhauling & Leakage Fixing available. Contact us for details!</p>';
          return;
        }
        container.innerHTML = services.map(s => `
          <div class="service-card">
            <h3>${s.title}</h3>
            <p>${s.description}</p>
            <strong>Price: ${s.price}</strong>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('services-list').innerText = 'Car AC Compressor Repair Services Active.';
      }
    }
    loadServices();
  </script>
</body>
</html><form id="loginForm">
  <input type="text" id="username" placeholder="Username" required />
  <input type="password" id="password" placeholder="Password" required />
  <button type="submit" id="loginBtn">Login</button>
</form>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      
      if (res.ok) {
        alert('Login Successful!');
        // Dashboard redirect logic
        window.location.href = '/dashboard.html';
      } else {
        alert(data.message || 'Login Failed');
      }
    } catch (err) {
      alert('Error connecting to server');
    }
  });
</script>
